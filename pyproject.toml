[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-pareto-optimizer"
version = "0.1.0"
description = "Multi-Objective Constrained Hardware Optimization (qEHVI) with Parametric CAD Export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "botorch>=0.11.0",
    "fastapi>=0.110.0",
    "pydantic>=2.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
